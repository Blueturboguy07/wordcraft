[package]
name = "wordcraft-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "WordCraft command line: convert, inspect, render, run commands, MCP server"

[[bin]]
name = "wordcraft-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# publik's usage counts (src/publik_telemetry.rs): the HTTP client that file needs.
ureq = "2"
wordcraft-doc = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-render = { workspace = true }
wordcraft-mcp = { workspace = true }
wordcraft-zotero = { workspace = true }
serde_json = { workspace = true }
sys-locale = "0.3"
