# publik build of WordCraft (telemetry v1 and later publik builds).
#
# It compiles the universal macOS binaries on a GitHub runner with this repo's own release script
# (packaging/macos/package.sh, ad-hoc signature, no notarization) and uploads them as artifacts.
# It holds no certificate. It reads one secret, PUBLIK_APP_TOKEN: the publik app token, which it
# writes to publik-app-token.txt (git ignores that file) for the build. It creates no release and no tag.
# publik then signs, notarizes and staples on its own Mac with the same script:
#   packaging/macos/package.sh --arch universal --skip-build   (Developer ID + notary profile)
name: publik build

on:
  push:
    branches: ["telemetry/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publik-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS universal (unsigned)
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
      # The fonts the release embeds (same pin as .github/workflows/release.yml).
      CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
      CRAFT_FONTS_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write the publik app token from the repository secret
        env:
          PUBLIK_APP_TOKEN: ${{ secrets.PUBLIK_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIK_APP_TOKEN}" ]; then echo "::error::the repository secret PUBLIK_APP_TOKEN is empty"; exit 1; fi
          printf '%s' "${PUBLIK_APP_TOKEN}" > publik-app-token.txt
          echo "publik-app-token.txt: $(wc -c < publik-app-token.txt | tr -d ' ') bytes"
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
      # The interface translations and the proofing language data (same pin as upstream's release:
      # craft-i18n.rev). crates/ui-egui/build.rs and craft-proof embed them from CRAFT_I18N_DIR;
      # CRAFT_I18N_REQUIRED=1 makes the build fail without them, as upstream's release does.
      - name: Read craft-i18n.rev
        id: i18n
        run: |
          rev="$(tr -d '[:space:]' < craft-i18n.rev)"
          [[ "$rev" =~ ^[0-9a-f]{40}$ ]] || { echo "::error file=craft-i18n.rev::expected one 40-character SHA, found '$rev'"; exit 1; }
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Check out craft-i18n
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-i18n
          ref: ${{ steps.i18n.outputs.rev }}
          path: craft-i18n
          persist-credentials: false
      - name: Use craft-i18n in the build
        run: |
          echo "CRAFT_I18N_DIR=$GITHUB_WORKSPACE/craft-i18n" >> "$GITHUB_ENV"
          echo "CRAFT_I18N_REQUIRED=1" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: publik-build-macos-universal
          cache-on-failure: true
      # The publik AI step (crates/ui-egui/src/ai.rs: Home › AI, File › Options › AI, the dialogs) and
      # the two upstream tests the publik changes touch (no Discord command, the Options page). The job
      # fails here, before packaging, when the port broke them. .cargo/config.toml sets DO_NOT_TRACK=1.
      - name: Test the publik AI step
        run: |
          cargo test --locked -p wordcraft-ui-egui --lib -- \
            ai::tests:: \
            tests::start_screen_shows_file_home_and_esc_leaves_no_document \
            tests::the_default_app_button_shows_only_with_the_hosts_hook
      - name: Build and package (ad-hoc signature, no notarization)
        run: |
          # The short commit, as publik's earlier builds carry it (<APP>_BUILD_SHA).
          export "$(echo "wordcraft" | tr '[:lower:]-' '[:upper:]_')_BUILD_SHA=$(git rev-parse --short HEAD)"
          packaging/macos/package.sh --arch universal
      - name: Collect the unsigned build
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/publik-out"
          mkdir -p "$OUT/bins" "$OUT/app"
          # 1. The thin binaries that `package.sh --skip-build` reads: target/<triple>/release/<bin>.
          : > "$OUT/bins.list"
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            find "target/$t/release" -maxdepth 1 -type f -perm +111 | while IFS= read -r f; do
              if file -b "$f" | grep -q "Mach-O"; then echo "${f#target/}" >> "$OUT/bins.list"; fi
            done
          done
          cat "$OUT/bins.list"
          [ -s "$OUT/bins.list" ]
          tar -czf "$OUT/bins/bins.tar.gz" -C target -T "$OUT/bins.list"
          # 2. The licence texts of the pinned craft-fonts checkout (package.sh copies them into the bundle).
          find craft-fonts/fonts -type f \( -name 'OFL*' -o -iname 'LICEN*' -o -iname '*.txt' \) -print0 \
            | tar -czf "$OUT/bins/craft-fonts-licences.tar.gz" --null -T -
          # 3. Facts about this build.
          {
            echo "slug=wordcraft"
            echo "commit=$(git rev-parse HEAD)"
            echo "build_sha=$(git rev-parse --short HEAD)"
            echo "publik_build=$(tr -d '[:space:]' < packaging/PUBLIK_BUILD)"
            echo "fonts_ref=b076417b5880bd4154bd22f00695b1d28c6bea83"
            echo "i18n_ref=${{ steps.i18n.outputs.rev }}"
            echo "runner=$(sw_vers -productName) $(sw_vers -productVersion) $(uname -m)"
            echo "rustc=$(rustc -V)"
            echo "cargo=$(cargo -V)"
            while IFS= read -r f; do
              echo "bin=$f archs=$(lipo -archs "target/$f") sha256=$(shasum -a 256 "target/$f" | cut -d' ' -f1)"
            done < "$OUT/bins.list"
            ls -l dist/release
          } | tee "$OUT/bins/build-info.txt"
          # 4. The ad-hoc signed app, packed with ditto (keeps symlinks). A reference copy.
          ditto -c -k --keepParent "target/macos-package/WordCraft.app" "$OUT/app/WordCraft.app.zip"
          ls -l "$OUT/bins" "$OUT/app"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-macos-bins
          path: ${{ runner.temp }}/publik-out/bins/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wordcraft-macos-adhoc-app
          path: ${{ runner.temp }}/publik-out/app/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
